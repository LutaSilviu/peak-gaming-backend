# Reduces parallel HTTP connections when downloading dependencies, to avoid
# tripping over intermittent network instability (TLS handshake failures)
# seen on some hosts under many simultaneous connections.
systemProp.http.maxConnections=4
systemProp.https.maxConnections=4
org.gradle.parallel=false

# Generous connect/read timeouts: some hosts see an intermediate transit hop
# with inconsistent latency to Maven Central / GitHub, well within normal
# download times (~20s for a ~150MB file) but past tight default timeouts.
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000
