spring.application.name=gaming

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peak_gaming}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:peak_gaming}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:peak_gaming}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.admin.api-key=${APP_ADMIN_API_KEY:peak2026}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.booking.open-hour=12
app.booking.close-hour=24

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
